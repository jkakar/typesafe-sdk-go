version: "2"

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - dupl
    - errcheck
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - prealloc
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    dupl:
      threshold: 250
  exclusions:
    rules:
      - linters:
          - dupl
        path: _test\.go

formatters:
  enable:
    - gofmt
