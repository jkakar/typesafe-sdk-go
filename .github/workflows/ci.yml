name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not read from go.mod: the `go` directive there is the
      # lowest version a caller needs, and the tests need a newer one for
      # testing/synctest and the goroutineleak profile.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: --timeout=5m

      # golangci-lint runs above with its own action, so `make check` would
      # repeat it. Everything else runs here.
      - run: make fmt-check tidy-check vet test
